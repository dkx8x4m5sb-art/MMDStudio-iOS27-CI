name: Build MMDStudio IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Download v7 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o MMDStudio-v7.zip "https://aka.doubaocdn.com/s/sNLAjf9Bbg"
          unzip -q -o MMDStudio-v7.zip
          test -d "MMDStudio/MMDStudio.xcodeproj"
          test -f "MMDStudio/Resources/pose_landmarker_lite.task"

      - name: Build IPA
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMDStudio-unsigned-v7
          path: build/*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v7
          path: build/xcodebuild.log
          if-no-files-found: ignore
