name: Build MMDStudio IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Prepare v6 base and apply v7 patches
        run: |
          set -euo pipefail
          test -f "MMDStudio-iOS27.zip"
          unzip -q -o "MMDStudio-iOS27.zip"
          test -d "MMDStudio.xcodeproj"
          python3 - <<'PY'
          import base64, gzip
          for stem in ("v7.patch", "v7-fix.patch"):
              raw = base64.b64decode(open(stem + ".gz.b64", "rb").read())
              open(stem + ".gz", "wb").write(raw)
              open(stem, "wb").write(gzip.decompress(raw))
          PY
          patch -p1 -N -f < v7.patch
          patch -p1 -N -f < v7-fix.patch
          grep -q "MARKETING_VERSION = 7.0" MMDStudio.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 7" MMDStudio.xcodeproj/project.pbxproj

      - name: Build IPA
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMDStudio-unsigned-v7
          path: build/*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v7
          path: build/xcodebuild.log
          if-no-files-found: ignore
