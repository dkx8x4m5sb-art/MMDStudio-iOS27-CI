name: Build MMDStudio IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Prepare complete v10.1 source
        run: |
          set -euo pipefail
          test -f "MMDStudio-v10.zip"
          unzip -q -o "MMDStudio-v10.zip"
          test -d "MMDStudio.xcodeproj"
          grep -q "MARKETING_VERSION = 10.1" MMDStudio.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = 11" MMDStudio.xcodeproj/project.pbxproj

      - name: Build IPA
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMDStudio-unsigned-v10.1
          path: build/*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v10.1
          path: build/xcodebuild.log
          if-no-files-found: ignore
